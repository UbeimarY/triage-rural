version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions (Angular 22, TypeScript 7) need a planned migration, not a bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Angular's packages must move together: one PR for all of them.
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
